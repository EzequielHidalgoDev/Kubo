name: App móvil

on:
  push:
    branches: [main]
    paths:
      - "app-movil/**"
  pull_request:
    paths:
      - "app-movil/**"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-movil

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Tiene que coincidir con la versión de Node usada en desarrollo:
          # npm resuelve/valida el lockfile distinto entre versiones
          # mayores, y con Node 20 "npm ci" fallaba con un lockfile que
          # local (Node 24) instala sin problema.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app-movil/package-lock.json

      - run: npm ci

      - name: Comprobar tipos de TypeScript
        run: npx tsc --noEmit -p .
